name: flight-lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: flight-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-pytest python3-numpy python3-scipy python3-psutil python3-yaml python3-websockets
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/dist
  headless-sitl:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          load: true
          tags: uav-lab
          build-args: LAB_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Three flights and bridge-loss landing
        run: |
          mkdir -p ci-evidence
          docker run --rm --shm-size=1g -v "$PWD/ci-evidence:/opt/uav_lab/.runtime" uav-lab bash scripts/ci_acceptance.sh
      - name: CPU LIO fixed observation replay and native map export
        run: docker run --rm --shm-size=1g -v "$PWD/ci-evidence:/opt/uav_lab/.runtime" uav-lab bash scripts/ci_localization.sh
      - name: CPU observed-space 3D navigation benchmark
        run: docker run --rm --shm-size=1g -v "$PWD/ci-evidence:/opt/uav_lab/.runtime" uav-lab bash scripts/ci_navigation.sh
      - name: Build pinned native workbench cores
        run: docker build -t uav-workbench -f containers/Dockerfile.workbench .
      - name: Real GLIM and three planner CPU fixtures
        run: docker run --rm --shm-size=1g -v "$PWD/ci-evidence:/opt/uav_lab/.runtime" uav-workbench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitl-evidence
          path: ci-evidence
